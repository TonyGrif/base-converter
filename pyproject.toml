[tool.poetry]
name = "base-converter"
version = "0.1.0"
description = "Convert decimal integers and floats to a new base equivalent"
authors = ["TonyGrif <TonyGriffin2000@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    {include = "src"},
]

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.test.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
tox = "^4.21"

[tool.poetry.group.dev.dependencies]
mypy = "^1.13"
black = "^24.10"
isort = "^5.13"
pylint = "^3.3"
ruff = "^0.8"
flake8-pyproject = "^1.2"

[tool.tox]
requires = ["tox>=4"]
env_list = ["py39", "py310", "py311", "py312", "py313"]

[tool.tox.env_run_base]
description = "Run the PyTest Suite."
skip_install = true
deps = ["poetry"]
commands_pre = [["poetry", "install", "--only", "main,test"]]
commands = [["poetry", "run", "pytest", "--cov"]]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = "True"

[tool.mypy]
files = ["src"]

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E701"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
